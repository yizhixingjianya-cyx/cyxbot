# Furtv API 配置文件
api:
  appid: your_appid
  appkey: your_appkey
  baseurl: https://api-vdp.hydun.com

# 毛图API配置
furry_api:
  base_url: https://furry.axzt.top
  format: json
  redirect: 1
  mode: large
  command: .furry
  request_timeout: 30

# 每日鉴毛(Furry Will / Furry Gallery) API 配置
furry_will:
  base_url: https://mrjm.fur-bot.com
  jwt_secret: your_jwt_secret
  jwt_qq: "1234567890"

