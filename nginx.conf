# Nginx 配置文件（**可选**，默认不用）
#
# 现在的部署方式不再依赖 Nginx：
#   - 图床由 util/static_server.py 在 11451 端口提供只读静态服务（已替代本文件）；
#   - guanli 管理面板走 28788 端口直通（默认 HTTPS 自签证书），不经过这里。
#
# 本文件仅在下面两种场景才需要（install_ubuntu.sh --with-nginx）：
#   1. 想把 11451 图床改挂到 80/443（例如用域名 + 正式证书）；
#   2. 需要 /api/ 反代或 /gl/ 应急入口。
# 若继续用本文件，请在 .env 里设 IMAGE_HOST_SERVE=false，避免和自带静态服务抢 11451。
#
# 功能（启用时）：HTTP 服务 (11451 端口) 提供 ftv 图床静态文件与 /api/ 反代；页面 JS 实现 HTTPS 重定向

worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
    use select;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # HTTP 服务器 - 11451 端口
    server {
        listen 11451;
        server_name localhost bot.xdgop.furrycdn.cn;

        # 静态文件服务
        location / {
            root html;
            index index.html index.htm;
            
            # 静态资源缓存
            location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }

        # API 反向代理到内部服务 2000 端口
        location /api/ {
            proxy_pass http://127.0.0.1:2000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 健康检查端点
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # guanli 管理Web面板反向代理（应急入口：面板本身走 28788 端口直通）
        location = /gl {
            return 301 /gl/;
        }
        location /gl/ {
            proxy_pass http://127.0.0.1:28788/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # uac.fursuit.tv 反向代理服务器 - 去除 Python 访问特征
    server {
        listen 1452;
        server_name uac.fursuit.tv;

        location / {
            # 反向代理目标
            proxy_pass http://127.0.0.1:2000/;
            
            # 设置浏览器级别的 User-Agent，去除 Python 特征
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            
            # 设置浏览器常见的请求头
            proxy_set_header Accept "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8";
            proxy_set_header Accept-Language "zh-CN,zh;q=0.9,en;q=0.8";
            proxy_set_header Accept-Encoding "gzip, deflate, br";
            
            # 传递必要的头部
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 移除可能暴露 Python 的头部
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            
            # 连接设置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # 启用 HTTP/1.1（Python 默认可能使用 HTTP/1.0）
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # 禁用请求缓冲，避免暴露特征
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # 健康检查端点
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
